name: Release & Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v1.0.0"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Minor version only: setup-go with check-latest resolves it to the newest
  # 1.27.x patch release, so CI always tests with the current toolchain.
  GO_VERSION: "1.27"
  # Container images are published only to Docker Hub.
  DOCKERHUB_NAMESPACE: synitio

jobs:
  verify:
    name: Verify Release Source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      commit: ${{ steps.source.outputs.commit }}
      image_tags: ${{ steps.floating.outputs.image_tags }}
    steps:
      - name: Resolve release tag
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$REQUESTED_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "${tag#v}" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            printf 'prerelease=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'prerelease=false\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
      - name: Validate release tag
        id: source
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git show-ref --verify --quiet "refs/tags/$TAG"
          test "$(git rev-list -n 1 "$TAG")" = "$(git rev-parse HEAD)"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Resolve floating image tags
        id: floating
        env:
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          # A pre-release gets only its exact version tag. A stable release also
          # gets "MAJOR.MINOR", "MAJOR", and "latest", but a floating tag only
          # moves forward: a patch for an older line must not overwrite it.
          version="${TAG#v}"
          tags="$version"
          if [ "$PRERELEASE" = "false" ]; then
            stable=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)
            major="${version%%.*}"
            minor="${version%.*}"
            highest=$(printf '%s\n' "$stable" | tail -n 1)
            highest_major=$(printf '%s\n' "$stable" | grep -E "^v${major}\." | tail -n 1)
            highest_minor=$(printf '%s\n' "$stable" | grep -E "^v${minor}\." | tail -n 1)
            [ "$highest_minor" = "$TAG" ] && tags="$tags $minor"
            [ "$highest_major" = "$TAG" ] && tags="$tags $major"
            if [ "$highest" = "$TAG" ]; then
              tags="$tags latest"
            fi
          fi
          echo "Image tags: $tags"
          printf 'image_tags=%s\n' "$tags" >> "$GITHUB_OUTPUT"
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      - name: Verify modules
        run: |
          gofmt_files=$(gofmt -l .)
          test -z "$gofmt_files" || { echo "$gofmt_files"; exit 1; }
          go mod verify
          go vet ./...
          go test ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          for module in services/ai-logs-receiver services/synit-llm-guard; do
            (cd "$module" && go mod verify && go vet ./... && go test ./... && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...)
          done
          go run ./tools/thirdparty -check

  publish-container:
    name: Build & Publish WAF Container
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        env:
          # Repository secrets: DOCKERHUB_USERNAME (or a repository variable
          # with the same name) and DOCKERHUB_TOKEN, an access token with
          # "Read & Write" scope for the synitio organization.
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be configured" >&2
            exit 1
          fi
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and publish multi-arch image
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          IMAGE_TAGS: ${{ needs.verify.outputs.image_tags }}
          COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          hub_image="docker.io/$DOCKERHUB_NAMESPACE/synit-waf"
          tags=()
          for image_tag in $IMAGE_TAGS; do
            tags+=(--tag "$hub_image:$image_tag")
          done

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file ./Dockerfile \
            --provenance=mode=max \
            --sbom=true \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=$COMMIT" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --build-arg "VERSION=$TAG" \
            "${tags[@]}" \
            --push \
            .

  publish-binaries:
    name: Build Binaries
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux, goarch: amd64, suffix: linux-amd64 }
          - { goos: linux, goarch: arm64, suffix: linux-arm64 }
          - { goos: linux, goarch: 386, suffix: linux-386 }
          - { goos: linux, goarch: arm, goarm: "7", suffix: linux-armv7 }
          - { goos: darwin, goarch: amd64, suffix: macos-amd64 }
          - { goos: darwin, goarch: arm64, suffix: macos-arm64 }
          - { goos: windows, goarch: amd64, suffix: windows-amd64, ext: .exe }
          - { goos: windows, goarch: arm64, suffix: windows-arm64, ext: .exe }
          - { goos: windows, goarch: 386, suffix: windows-386, ext: .exe }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          GOARM: ${{ matrix.target.goarm }}
          TARGET_SUFFIX: ${{ matrix.target.suffix }}
          EXT: ${{ matrix.target.ext }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          mkdir -p dist
          go build \
            -ldflags "-X 'github.com/synit-io/synit-waf/internal/waf.Version=$TAG'" \
            -o "dist/synit-waf-${TARGET_SUFFIX}${EXT}" \
            ./cmd/synit-waf

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synit-waf-${{ matrix.target.suffix }}
          path: dist/synit-waf-*
          if-no-files-found: error

  publish-release:
    name: Create/Update GitHub Release
    needs: [verify, publish-container, publish-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download all binary artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist

      - name: Build release notes from git history
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # The commit history is the changelog. The notes list the
          # Conventional Commits between the previous tag and this one.
          {
            ./scripts/release-notes.sh "$TAG"
            echo
            echo "## Container images"
            echo
            echo "- Docker Hub: \`$DOCKERHUB_NAMESPACE/synit-waf:$VERSION\`"
            echo
            echo "The optional LLM guard and log receiver require [operator builds](https://github.com/${{ github.repository }}/blob/$TAG/docs/deployment_models.md#build-the-optional-services)."
          } > release-notes.md
          cat release-notes.md

      - name: Create checksums
        run: |
          mapfile -t files < <(find dist -type f -name 'synit-waf-*' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets found" >&2
            exit 1
          fi
          mkdir -p release-assets
          for file in "${files[@]}"; do
            cp "$file" "release-assets/$(basename "$file")"
          done
          cp third_party/THIRD_PARTY_NOTICES.txt third_party/manifest.json release-assets/
          (cd release-assets && find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs sha256sum > ../SHA256SUMS)

      - name: Attest binary provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: SHA256SUMS

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          existing=false
          if gh release view "$TAG" >/dev/null 2>&1; then
            existing=true
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --draft --latest=false
          fi

          mapfile -t files < <(find release-assets -maxdepth 1 -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets found" >&2
            exit 1
          fi

          gh release upload "$TAG" "${files[@]}" SHA256SUMS --clobber
          if [ "$existing" = true ]; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md --prerelease="$PRERELEASE" --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE" --latest=false
          fi
